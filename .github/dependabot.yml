version: 2
updates:
  # Keeps the Actions used by our workflows (including security-review.yml) patched.
  # Free on both public and private repos, unlike Dependabot's npm ecosystem alerts UI
  # for CodeQL-style dashboards — this just opens PRs, no GHAS needed.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait a week before proposing a newly published version: a compromised release is usually
    # caught and pulled within days. Security updates aren't held back by this.
    cooldown:
      default-days: 7
