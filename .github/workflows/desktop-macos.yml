name: Desktop (macOS)

# Builds the macOS desktop app (desktop/) for both architectures, verifies the packed bundle,
# smoke-tests the one that matches the runner, and uploads the DMGs/checksums as build artifacts.
#
# On its own this is a CI build: artifacts are kept for 14 days and published nowhere. A `v*` tag
# runs it through desktop-release.yml (`workflow_call`), which attaches the macOS files to the
# GitHub release: under its plain name when `notarized` comes out true, otherwise as a `*-preview`
# build labelled "(preview)" — until the Apple Developer Program secrets below exist the app is
# ad-hoc signed, and Gatekeeper refuses an ad-hoc signed download
# (right-click → Open gets past it; see desktop/README.md). The build is identical either way.
#
# Signing and notarization are switched on by secrets alone (desktop/electron-builder.cjs
# reads the environment; nothing here branches on it). The day-of procedure for creating them is
# runbooks/MACOS_SIGNING.md.
#
#   MAC_CSC_LINK             base64 of the Developer ID Application .p12   → imported into a
#   MAC_CSC_KEY_PASSWORD     its password                                     job keychain; its
#                                                                             SHA-1 → CSC_NAME
#   Notarization, either an App Store Connect API key:
#   APPLE_API_KEY_P8         contents of the .p8 key                        → written to a file,
#                                                                              its path → APPLE_API_KEY
#   APPLE_API_KEY_ID         the key's id                                   → APPLE_API_KEY_ID
#   APPLE_API_ISSUER         the issuer id                                  → APPLE_API_ISSUER
#   or an Apple ID (simplest for an individual membership):
#   APPLE_ID                 the Apple Account email                        → APPLE_ID
#   APPLE_APP_SPECIFIC_PASSWORD  an app-specific password for it            → APPLE_APP_SPECIFIC_PASSWORD
#   APPLE_TEAM_ID            the 10-character Team ID                       → APPLE_TEAM_ID
#
# The .p12 is imported here rather than handed to electron-builder as CSC_LINK: electron-builder
# 26.15.3 unlocks its own temporary keychain with the .p12's password instead of the keychain's
# (app-builder-lib/out/codeSign/macCodeSign.js, importCerts), so CSC_LINK fails at
# `set-key-partition-list` whenever the two differ — always. Found by rehearsing the signed path
# with a self-signed identity (desktop/scripts/rehearse-mac-signing.sh).
#
# An empty secret expands to an empty string, which the config treats as absent — so a repo
# without them builds exactly as a developer's machine without them does. Half a configuration
# (a certificate without notarization credentials, or the reverse) fails the Notarization check
# rather than shipping a build that is signed but refused by Gatekeeper.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'standalone/**'
      - 'src/**'
      - 'media/**'
      - 'scripts/check-edition.mjs'
      - 'esbuild.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-macos.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:
  workflow_call:
    # The only secrets this workflow reads — desktop-release.yml passes exactly these, never
    # `secrets: inherit`. All optional: without them the app is ad-hoc signed (see above).
    secrets:
      MAC_CSC_LINK: { required: false }
      MAC_CSC_KEY_PASSWORD: { required: false }
      APPLE_API_KEY_P8: { required: false }
      APPLE_API_KEY_ID: { required: false }
      APPLE_API_ISSUER: { required: false }
      APPLE_ID: { required: false }
      APPLE_APP_SPECIFIC_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }
    outputs:
      notarized:
        description: "'true' when both apps are Developer ID signed and carry a stapled notarization ticket"
        value: ${{ jobs.package.outputs.notarized }}

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a release's run of this workflow and
# a pull request's run of it never cancel each other.
concurrency:
  group: desktop-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Apple Silicon runner. The x64 app is cross-built on it (electron-builder downloads the x64
    # Electron; the app has no native modules), so both artifacts come out of one job. Only the
    # arm64 app is launched for the smoke test — running the x64 one here would go through Rosetta,
    # which is not the same as validating it on an Intel Mac.
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      notarized: ${{ steps.notarization.outputs.notarized }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install repo dependencies
        run: pnpm install --frozen-lockfile

      # desktop/ is deliberately outside the pnpm workspace (its README says why); it has its own
      # npm lockfile pinning Electron and electron-builder.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # npm on the runner no longer runs Electron's postinstall, which leaves node_modules/electron/
      # dist/ without the binary and without LICENSES.chromium.html (electron-builder.cjs copies it into the bundle,
      # afterPack requires it). install.js is the postinstall itself and is a no-op when it already ran.
      - name: Download the Electron binary
        working-directory: desktop
        run: node node_modules/electron/install.js && test -f node_modules/electron/dist/LICENSES.chromium.html

      # Only runs when the certificate secret exists. A job-scoped keychain holding the Developer ID
      # identity plus Apple's Developer ID intermediates (a .p12 exported from Keychain Access carries
      # the leaf only, and `find-identity -v` lists an identity only when its chain is complete).
      # electron-builder is then given the identity's SHA-1 as CSC_NAME and the keychain as
      # CSC_KEYCHAIN. A CSC_NAME that matches nothing would make electron-builder skip signing with
      # a warning, so the identity is looked up here and a missing one fails the step.
      - name: Import the Developer ID certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        if: env.MAC_CSC_LINK != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -n "$line" ] && existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MAC_CSC_LINK holds no valid 'Developer ID Application' identity (wrong certificate type, wrong password, or the private key was not exported with it). See runbooks/MACOS_SIGNING.md."
            exit 1
          fi
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Only runs when the notarization key secret exists; otherwise APPLE_API_KEY stays unset and
      # the config leaves notarization off. (The `secrets` context cannot be read in a step's `if`,
      # hence the detour through `env`.)
      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Type-checks, bundles the main process (release build), stages the core-edition collector,
      # writes the third-party notices, packs arm64 + x64 (afterPack verifies each .app: layout,
      # versions, core edition, bundled Node), and writes SHA256SUMS.
      - name: Build and package
        working-directory: desktop
        env:
          # CSC_NAME and CSC_KEYCHAIN come from the import step above, when it ran.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # No keychain search on a runner: either CSC_NAME names the imported identity or the
          # config ad-hoc signs. (The same variable is harmless on a developer's machine.)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips *all* signing on a pull-request build (it sees GITHUB_BASE_REF)
          # unless told otherwise, and that would include the ad-hoc signature Apple Silicon needs
          # to launch the app for the smoke test. The warning this silences is about leaking a
          # signing certificate to fork PRs; GitHub never exposes repository secrets to a fork's
          # workflow run, so a fork PR here can only ever produce an ad-hoc build.
          CSC_FOR_PULL_REQUEST: 'true'
        run: pnpm run pack

      # Launch the packaged arm64 app with HOME redirected: owned mode, bound ports, identity probe,
      # dashboard served, SIGTERM → flushed collector and released lock.
      - name: Smoke test the packaged app
        working-directory: desktop
        run: pnpm run smoke

      # The staged-tree integration suite (src/stagedCollector.test.ts) is skipped on the Ubuntu and
      # Windows CI legs because they have no Electron; here it has one.
      - name: Staged collector integration tests
        run: pnpm run compile-tests:desktop && npx mocha --grep "staged collector" --color

      # With signing and notarization configured, a build that is not actually Developer ID signed,
      # hardened and stapled is a failure, not a silent fallback; so is half a configuration. With
      # neither, `notarized=false` attaches the macOS files to a release as a preview
      # (desktop-release.yml).
      - name: Notarization check
        id: notarization
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=false; notary=false
          [ -n "${CSC_NAME:-}" ] && signing=true
          if [ -n "${APPLE_API_KEY:-}" ] || { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; }; then notary=true; fi
          if [ "$signing" = false ] && [ "$notary" = false ]; then
            echo "::notice::macOS build is ad-hoc signed (no Apple Developer secrets); a release attaches it as *-preview"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$signing" != "$notary" ]; then
            echo "::error::Apple signing is half configured (certificate: $signing, notarization credentials: $notary). Both are needed for a download Gatekeeper accepts — see runbooks/MACOS_SIGNING.md."
            exit 1
          fi
          for app in dist/mac*/TraceRoost.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign --display --verbose=2 "$app" 2>&1)"
            grep -q '^Authority=Developer ID Application: ' <<<"$details" || { echo "::error::$app is not signed with a Developer ID Application certificate"; exit 1; }
            grep -q 'flags=.*runtime' <<<"$details" || { echo "::error::$app is not signed with the hardened runtime"; exit 1; }
            if [ -n "$APPLE_TEAM_ID" ] && ! grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$details"; then
              echo "::error::$app is signed by team $(grep TeamIdentifier <<<"$details"), not APPLE_TEAM_ID"; exit 1
            fi
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      # The job keychain dies with the runner, but delete it anyway so nothing outlives the job.
      - name: Remove the signing keychain
        if: always() && env.CSC_KEYCHAIN != ''
        run: security delete-keychain "$CSC_KEYCHAIN" || true

      - name: Signature report
        working-directory: desktop
        run: |
          for app in dist/mac*/TraceRoost.app; do
            echo "== $app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Authority|Signature|TeamIdentifier|flags' || true
          done
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceroost-desktop-macos
          path: |
            desktop/dist/TraceRoost-*.dmg
            desktop/dist/SHA256SUMS
            desktop/resources/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
