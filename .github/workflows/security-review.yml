name: Security & dependency review

# Scheduled, not on push/PR — this is a periodic audit, not a merge gate.
# Design doc has since been removed from .staged-features/ (shipped, git history has it).
on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pinned release binary, checked against its published sha256 — not the upstream
      # install script piped from `main`, which ran whatever that branch held at the time.
      # DB freshness doesn't depend on the CLI version: Trivy re-downloads its vulnerability DB
      # every run. To bump: take the new version's Linux-64bit line from its
      # trivy_<version>_checksums.txt release asset.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          rm trivy.tar.gz
          trivy --version

      - name: Dependency, secret & misconfig scan (Trivy)
        run: trivy fs --scanners vuln,secret,misconfig,license --format json --output trivy.json --exit-code 0 .

      - name: Install Semgrep
        run: python3 -m pip install --quiet semgrep

      # Explicit free rule packs, not --config=auto — auto requires metrics to be on
      # (phones home), which doesn't fit a repo that's explicit about what leaves it.
      - name: Static analysis (Semgrep)
        run: |
          semgrep scan \
            --config=p/security-audit --config=p/secrets --config=p/typescript \
            --config=p/javascript --config=p/owasp-top-ten \
            --metrics=off --json --output semgrep.json .
        continue-on-error: true

      - name: Outdated dependencies
        run: pnpm outdated --format json > outdated.json || true

      - name: Build report
        run: |
          node scripts/security-review/report.mjs \
            --trivy trivy.json --semgrep semgrep.json --outdated outdated.json \
            --repo "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out report.md --counts counts.json

      - name: Publish job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-review-raw-${{ github.run_id }}
          path: |
            trivy.json
            semgrep.json
            outdated.json
            report.md
            counts.json
          retention-days: 90

      - name: Upsert tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create security-review --color 5319e7 --description "Recurring security & dependency review report" 2>/dev/null || true
          existing=$(gh issue list --state open --label security-review --json number,title \
            --jq '.[] | select(.title == "Security & dependency review") | .number' | head -n1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "Security & dependency review" --body-file report.md --label security-review
          fi

      - name: Fail on critical findings
        run: |
          if [ "$(node -pe "require('./counts.json').shouldFail")" = "true" ]; then
            echo "::error::Critical vulnerabilities or secrets found — see the job summary and the tracking issue."
            exit 1
          fi
