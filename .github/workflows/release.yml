name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

  # This branch does NOT publish the VS Code extension. The
  # agentlens.agentlens-dashboard marketplace listing is published from `main`
  # (rebranded, same id — installs update in place). Releases here go to the
  # frozen `agentlens-dashboard` npm package and `agentlens/agentlens` Docker
  # image only, for the final "we've moved to TraceRoost" release. The GH Release
  # still carries the .vsix as a sideload artifact.

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret needed)

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # registry-url is required so setup-node writes the registry endpoint to
          # .npmrc. Without it, npm throws ENEEDAUTH before attempting OIDC.
          # NODE_AUTH_TOKEN must NOT be set in the publish step so npm falls back
          # to OIDC Trusted Publishing instead of classic token auth.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # OIDC Trusted Publishing requires npm 11.x+; keep this in sync with
        # whatever version ships bundled with the node-version above.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # Trusted Publishing: npm exchanges the GitHub Actions OIDC token for a
        # short-lived publish credential — no NPM_TOKEN secret required.
        # NODE_AUTH_TOKEN must not be set; npm falls back to OIDC when it is absent.
        run: npm publish --access public --provenance
