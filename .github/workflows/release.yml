name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

  # Publishes the extension under two identities during the AgentLens -> TraceRoost
  # transition:
  #   - traceroost.traceroost           — the new identity (TR_-prefixed secrets)
  #   - agentlens.agentlens-dashboard    — the existing marketplace listing, so
  #                                        current users auto-update into the
  #                                        rebranded extension (reuses the
  #                                        AgentLens publisher's PAT)
  # The VSIX manifest bakes in publisher + name, so each identity is packaged
  # separately from a patched package.json. Every displayName / icon / contributes
  # entry is identical — only the id differs. To stop the compat publish, remove
  # the VSCE_PAT / OVSX_PAT repo secrets (the steps self-skip when unset) or drop
  # the second matrix entry.
  publish-vsce:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: traceroost
            publisher: traceroost
            name: traceroost
            vsce_pat: TR_VSCE_PAT
            ovsx_pat: TR_OVSX_PAT
          - identity: agentlens-compat
            publisher: agentlens
            name: agentlens-dashboard
            vsce_pat: VSCE_PAT
            ovsx_pat: OVSX_PAT
    env:
      VSCE_PAT: ${{ secrets[matrix.vsce_pat] }}
      OVSX_PAT: ${{ secrets[matrix.ovsx_pat] }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set publish identity (${{ matrix.publisher }}.${{ matrix.name }})
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = process.env.PKG_NAME;
            p.publisher = process.env.PKG_PUBLISHER;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
        env:
          PKG_NAME: ${{ matrix.name }}
          PKG_PUBLISHER: ${{ matrix.publisher }}

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies -o ${{ matrix.identity }}.vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          set +e
          vsce publish --packagePath ${{ matrix.identity }}.vsix > out.txt 2>&1
          EXIT=$?
          set -e
          cat out.txt
          if [ $EXIT -ne 0 ] && grep -q "already exists" out.txt; then
            echo "Version already published to VS Code Marketplace — skipping"
            exit 0
          fi
          exit $EXIT

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npm install -g ovsx
          set +e
          ovsx publish ${{ matrix.identity }}.vsix > out.txt 2>&1
          EXIT=$?
          set -e
          cat out.txt
          if [ $EXIT -ne 0 ] && grep -qiE "already (exists|published)" out.txt; then
            echo "Version already published to Open VSX — skipping"
            exit 0
          fi
          exit $EXIT

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret needed)

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # registry-url is required so setup-node writes the registry endpoint to
          # .npmrc. Without it, npm throws ENEEDAUTH before attempting OIDC.
          # NODE_AUTH_TOKEN must NOT be set in the publish step so npm falls back
          # to OIDC Trusted Publishing instead of classic token auth.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # OIDC Trusted Publishing requires npm 11.x+; keep this in sync with
        # whatever version ships bundled with the node-version above.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # Trusted Publishing: npm exchanges the GitHub Actions OIDC token for a
        # short-lived publish credential — no NPM_TOKEN secret required.
        # NODE_AUTH_TOKEN must not be set; npm falls back to OIDC when it is absent.
        run: npm publish --access public --provenance
