name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run: builds (and uploads as an artifact) a VSIX of the chosen edition without creating a
  # release or publishing anything — publishing only ever happens from a pushed `v*` tag.
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build — core (no TraceRoost Cloud code) or full (with org link + upload)'
        type: choice
        options: [core, full]
        default: core

permissions:
  contents: write

# Which edition this run ships (see runbooks/RELEASING.md → "Editions"). A manual run uses its
# `edition` input; a tag push uses the TRACEROOST_RELEASE_EDITION repository variable, and `core`
# when that isn't set. Until TraceRoost Cloud launches every tagged release is `core`: the VSIX, the
# npm package and the Docker image carry no org-link/upload code at all.
# To ship `full` at launch: set the repository variable TRACEROOST_RELEASE_EDITION=full
# (Settings → Secrets and variables → Actions → Variables) — docker.yml reads the same variable —
# or change the `'core'` fallback below (and in docker.yml) to `'full'`.
env:
  EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.edition || vars.TRACEROOST_RELEASE_EDITION || 'core' }}

jobs:
  # Blocking pre-release privacy gate: proves that the only payload this client can send to
  # TraceRoost Cloud (`RollupPayload`, defined in src/cloud/forward/schema.ts) is still the closed,
  # no-free-text wire shape it's meant to be, and that nothing in `forward/` can reach around it
  # (a stray `any`/`as unknown` cast, an import of the internal type that actually carries
  # prompts/completions/diffs, or a new fetch call to the ingest endpoints from outside
  # sender.ts). See schema.ts's header comment for the design this mechanically enforces. A
  # failure here fails the whole release: `package` (and everything downstream of it) depends on
  # this job.
  privacy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforces (among the repo's other lint rules): no `any`/`as unknown` escape hatches and no
      # SessionSummaryCard/ingest-endpoint imports outside sender.ts within src/cloud/forward/.
      - name: Lint (cloud wire-format boundary rules)
        run: pnpm run lint

      - name: Compile tests
        run: pnpm run compile-tests

      # Isolated to the schema-drift guard specifically, so a failure here reads as "cloud privacy
      # contract broken" rather than "some test somewhere failed". schemaViolations() (schema.ts)
      # walks the committed schema/rollup.v1.json and fails if any string is unconstrained or any
      # object allows additionalProperties — see src/test/cloud/forward/schema.test.ts.
      - name: Cloud wire-schema privacy contract
        run: npx mocha --grep "forward/schema" --color

      - name: Generate privacy certificate
        run: node scripts/privacy-certificate.mjs

      # Sigstore-signed, publicly verifiable provenance tying this exact certificate content to
      # this commit and workflow run — later checked with:
      #   gh attestation verify privacy-certificate.json --repo <owner>/<repo>
      - name: Attest certificate provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: privacy-certificate.json

      - name: Upload privacy certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privacy-certificate
          path: privacy-certificate.json
          retention-days: 365

  package:
    needs: privacy-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify the pushed tag matches package.json's version
        # Mirrors release-styles.yml. docker.yml runs the same check, so a tag
        # pushed without bumping package.json can't publish a VSIX, npm package,
        # or Docker `:latest` built from a different version than the tag names.
        # Skipped for manual workflow_dispatch runs, which publish nothing.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json's version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Download privacy certificate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: privacy-certificate

      # Rewrites package.json for the edition being released: for `core` it drops the Org commands
      # and the cloud directories' files, and points `vscode:prepublish` at `package:core` so
      # `vsce package` below builds the core bundles and runs scripts/check-edition.mjs. A no-op for
      # `full`. This checkout is discarded after the job, so there's nothing to restore.
      - name: Prepare the ${{ env.EDITION }} edition manifest
        run: node scripts/prepare-edition.mjs "$EDITION"

      # package.json carries the npm identity (`traceroost`). The VS Code
      # Marketplace identity lives in vsce-identity.json and is patched in here,
      # for the VSIX build only — so the extension keeps publishing to the
      # existing agentlens.agentlens-dashboard listing (installs update in place)
      # while npm gets the new name. This checkout is discarded after the job.
      #
      # Also drops package.json's `files` allowlist (added for npm — see CHANGELOG "The npm
      # package shipped the whole repo") for this VSIX-only copy: current vsce refuses to run
      # at all when both a .vscodeignore file and a `files` property exist ("VSCE does not
      # support combining both strategies"), where older vsce silently preferred .vscodeignore
      # (see .vscodeignore's own header comment). The VSIX has always been built from
      # .vscodeignore, never `files`, so dropping `files` here changes nothing about what ships
      # in the VSIX — it only satisfies vsce's newer up-front check. publish-npm runs
      # prepare-edition.mjs on its own separate checkout and is unaffected.
      - name: Set VS Code Marketplace identity
        run: |
          node -e '
            const fs = require("fs");
            const id = JSON.parse(fs.readFileSync("vsce-identity.json", "utf8"));
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = id.name;
            p.publisher = id.publisher;
            delete p.files;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            console.log(`vsce identity: ${id.publisher}.${id.name}`);
          '

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      # Belt and braces: `package:core` already ran this during `vsce package`; re-run it on what
      # actually got packed (and, for `full`, confirm the Cloud code really is there).
      - name: Check the ${{ env.EDITION }} edition bundles
        run: node scripts/check-edition.mjs "$EDITION"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-package
          path: '*.vsix'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            *.vsix
            privacy-certificate.json
          generate_release_notes: true

  # Publishes the pre-built VSIX from the `package` job (which already stamped it
  # with the vsce-identity.json marketplace id — agentlens.agentlens-dashboard).
  # Existing installs update in place; there is one marketplace listing.
  publish-vsce:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix-package

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npm install -g @vscode/vsce
          set +e
          vsce publish --packagePath *.vsix > out.txt 2>&1
          EXIT=$?
          set -e
          cat out.txt
          if [ $EXIT -ne 0 ] && grep -q "already exists" out.txt; then
            echo "Version already published to VS Code Marketplace — skipping"
            exit 0
          fi
          exit $EXIT

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npm install -g ovsx
          set +e
          ovsx publish *.vsix > out.txt 2>&1
          EXIT=$?
          set -e
          cat out.txt
          if [ $EXIT -ne 0 ] && grep -qiE "already (exists|published)" out.txt; then
            echo "Version already published to Open VSX — skipping"
            exit 0
          fi
          exit $EXIT

  publish-npm:
    needs: package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for npm Trusted Publishing (OIDC — no stored secret needed)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          # registry-url is required so setup-node writes the registry endpoint to
          # .npmrc. Without it, npm throws ENEEDAUTH before attempting OIDC.
          # NODE_AUTH_TOKEN must NOT be set in the publish step so npm falls back
          # to OIDC Trusted Publishing instead of classic token auth.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # OIDC Trusted Publishing requires npm 11.x+; keep this in sync with
        # whatever version ships bundled with the node-version above.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same manifest the VSIX was packed from — `npm publish`'s prepublishOnly then builds and
      # checks this edition (package:core for `core`).
      - name: Prepare the ${{ env.EDITION }} edition manifest
        run: node scripts/prepare-edition.mjs "$EDITION"

      - name: Publish to npm
        # Trusted Publishing: npm exchanges the GitHub Actions OIDC token for a
        # short-lived publish credential — no NPM_TOKEN secret required.
        # NODE_AUTH_TOKEN must not be set; npm falls back to OIDC when it is absent.
        run: npm publish --access public --provenance
