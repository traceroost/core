name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # The CLA allowlist below matches commit author *names* — Claude Code's commits
  # (Claude <noreply@anthropic.com>) have no GitHub account to match. A pull request from a fork
  # could borrow one of those names to skip the CLA, so on fork PRs every commit must belong to a
  # GitHub account and none may carry an allowlisted name unless it is RogerReed's own. Branches
  # pushed to this repository (which needs write access) are not affected. Reads commit metadata
  # through the API only — nothing from the pull request is checked out or run.
  allowlist-guard:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Fork commits use real accounts, not allowlisted names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | [.sha[0:7], (.author.login // "-"), .commit.author.name] | @tsv' > commits.tsv
          bad=$(awk -F'\t' '$2 != "RogerReed" && ($2 == "-" || $3 == "Claude" || $3 == "claude" || $3 == "RogerReed")' commits.tsv)
          if [ -n "$bad" ]; then
            echo "::error::These commits have no GitHub account, or use a name the CLA check exempts. Commit with an email linked to your GitHub account and sign the CLA."
            echo "$bad"
            exit 1
          fi

  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/traceroost/core/blob/main/.github/CLA.md
          # Dedicated, unprotected branch for signature storage — main requires PRs, so the
          # action's own commit of the signature record can't land there directly.
          branch: cla-signatures
          # Claude <noreply@anthropic.com> commits have no GitHub account, so the action matches
          # them by author name. Commits made from a Claude Code web session are attributed to the
          # `claude` GitHub account instead, and Dependabot's to `dependabot[bot]`.
          allowlist: RogerReed,Claude,claude,dependabot[bot]
          custom-notsigned-prcomment: |
            Thanks for this contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/traceroost/core/blob/main/.github/CLA.md)
            and sign it by commenting on this pull request with:

            > I have read the CLA Document and I hereby sign the CLA
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
