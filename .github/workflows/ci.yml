name: CI

on:
  push:
    branches: [main, cloud]
  pull_request:
    branches: [main, cloud]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows sits alongside Ubuntu, not behind it: this extension does real OS-sensitive work
      # (path handling, spawning `git`, sql.js WASM, reading log locations under the user's home
      # dir) that Ubuntu-only CI has never exercised — see the Windows-validation discussion this
      # job follows up on. fail-fast: false so a Windows-only failure doesn't cancel the Ubuntu
      # leg (and vice versa) — they're independent signals, not a single pass/fail gate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build production bundle
        run: pnpm run package

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: UX evaluations
        run: pnpm run test:ux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-ux-report-${{ matrix.os }}
          path: test-results/ux/
          retention-days: 14
