name: CI

on:
  push:
    branches: [main, cloud]
  pull_request:
    branches: [main, cloud]

# Read-only: nothing in CI writes to the repo (artifact uploads need no token scope).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows sits alongside Ubuntu, not behind it: this extension does real OS-sensitive work
      # (path handling, spawning `git`, sql.js WASM, reading log locations under the user's home
      # dir) that Ubuntu-only CI has never exercised — see the Windows-validation discussion this
      # job follows up on. fail-fast: false so a Windows-only failure doesn't cancel the Ubuntu
      # leg (and vice versa) — they're independent signals, not a single pass/fail gate.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      # Generates the demo span fixtures and checks each summarizes to what it expects (sessions,
      # LLM and tool calls, loop signals). Nothing else ran it, so it failed unnoticed after the
      # 2026-09 loop-signal recalibration.
      - name: Fixture check
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run fixtures:check

      # Informational only: the target is 80% lines and branches, but nothing here can fail the
      # job (continue-on-error, no c8 thresholds). Reuses the test build the step above compiled;
      # `pnpm run test:coverage` is the local equivalent (it cleans and recompiles first).
      # Runs on both legs: Windows-only branches (path handling, lock retries, service code) only
      # show up in the Windows numbers. bash so the same script works on the Windows runner.
      - name: Unit test coverage (informational)
        continue-on-error: true
        shell: bash
        run: |
          pnpm exec c8 mocha --reporter dot
          {
            echo "### Unit test coverage (${{ matrix.os }})"
            echo 'Target: 80% lines and branches (informational; does not fail CI).'
            echo '```'
            pnpm exec c8 report --reporter=text-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: core-coverage-lcov-${{ matrix.os }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build production bundle
        run: pnpm run package

      # The full build must still carry every Cloud marker the core check looks for — otherwise a
      # stale marker list would let the core-edition job below pass on anything.
      - name: Check edition markers (full)
        run: node scripts/check-edition.mjs full

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: UX evaluations
        run: pnpm run test:ux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: core-ux-report-${{ matrix.os }}
          path: test-results/ux/
          retention-days: 14

  # The core edition (no TraceRoost Cloud — org link + upload — code at all) is built from the same
  # sources with `--edition=core`; see runbooks/RELEASING.md → "Editions". This job proves no cloud
  # code reaches the core bundles or the core-prepared package, and that the core CLI still runs.
  # Unit tests run against the TypeScript sources (both editions share them), so the tests for the
  # cloud modules keep running here and in build-and-test above.
  core-edition:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core edition (production)
        run: node esbuild.js --production --edition=core

      - name: Check core bundles and core manifest carry no Cloud code
        run: |
          node scripts/prepare-edition.mjs core --out "$RUNNER_TEMP/package.core.json"
          node scripts/check-edition.mjs core --package "$RUNNER_TEMP/package.core.json"

      - name: Check the core npm tarball ships no cloud files
        run: |
          node scripts/prepare-edition.mjs core
          npm pack --dry-run --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/pack.txt"
          node scripts/prepare-edition.mjs restore
          if grep -i 'cloud/' "$RUNNER_TEMP/pack.txt"; then
            echo "core npm tarball lists a cloud file"
            exit 1
          fi

      - name: Smoke-test the core CLI
        run: |
          node standalone/cli.js --help
          if node standalone/cli.js org status; then
            echo "expected 'traceroost org' to be unavailable in the core edition"
            exit 1
          fi

      - name: Unit tests
        run: pnpm run test:unit
